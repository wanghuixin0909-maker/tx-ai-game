# =============================================================================
# Cloud Studio 部署配置文件
# =============================================================================

# Cloud Studio 部署配置
cloudstudio:
  project:
    name: neon-echo
    type: docker-compose
    region: hkg  # 香港节点，可选: sha/sgp/hkg
    
  services:
    frontend:
      build:
        dockerfile: Dockerfile.frontend
        context: /
      ports:
        - container: 80
          host: 80
          
    backend:
      build:
        dockerfile: Dockerfile.backend
        context: /
      ports:
        - container: 8000
          host: 8000
      env:
        - HUNYUAN_API_KEY: "${HUNYUAN_API_KEY}"
        - LLM_TIMEOUT_SECONDS: "45"
        - NPC_MEMORY_TURNS: "12"
        - ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
        
    nginx:
      image: nginx:alpine
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      ports:
        - container: 443
          host: 443
        - container: 80
          host: 80
      depends_on:
        - frontend
        - backend

# 环境变量（通过 Cloud Studio 控制台设置）
# HUNYUAN_API_KEY=your_api_key
# ALLOWED_ORIGINS=https://your-domain.com
