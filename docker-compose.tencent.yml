services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cyber-case-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.tencent.http.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cyber-case-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cyber-case-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - cyber-case-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cyber-case-backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env.production
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - cyber-case-network

networks:
  cyber-case-network:
    driver: bridge
